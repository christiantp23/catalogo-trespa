    <!-- Preconnect a Google Fonts: el navegador arranca el handshake
         (DNS + TLS) con estos dominios en paralelo, apenas lee el HTML, en
         vez de recién enterarse de que los necesita cuando procesa el
         @import de la hoja de estilos. crossorigin en gstatic porque ahí
         se descargan los archivos de fuente (con CORS), no solo el CSS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

<meta name="description" content="Trespa Store es una tienda online de zapatillas con una amplia variedad de estilos para hombre y mujer. Compra fácilmente por WhatsApp y recibe tu pedido con envío a toda Colombia." />
